---
- name: Install Bareos-FD 22.0.4 (x64) on Windows Server
  ansible.windows.win_package:
    path: "{{ item }}"
    product_id: Bareos
    provider: registry
    arguments: /S
    state: present
  with_items:
    - "https://download.bareos.org/current/windows/Bareos-24.0.4~pre30.dd9a00734-x64-Release.exe"
  notify:
    - Restart bareos-fd service
