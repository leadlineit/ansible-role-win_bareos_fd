---
- name: Install Bareos-FD 22.0.4 (x64) on Windows Server
  ansible.windows.win_package:
    path: "{{ item }}"
    product_id: Bareos
    provider: registry
    arguments: /S
    state: present
  with_items:
    - "https://download.bareos.org/current/windows/winbareos-22.0.4~pre114.45a6341f6-release-64-bit.exe"
  notify:
    - Restart bareos-fd service
